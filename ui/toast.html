<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Quick Achieve 提示</title>
<link rel="stylesheet" href="theme.css">
<style>
/* 右下角内置提示（v2.6.8）。
 * 独立小窗（336×88 逻辑像素、无边框、透明、置顶、不抢焦点、鼠标穿透），
 * 所以样式全写在这里，不引 bar.css / settings.css（那两个一个 2500 行、
 * 一个 3800 行，为了这么一张小卡片去解析它们只会拖慢首帧）。 */
* { box-sizing: border-box; }

/* v2.23.34：**调色板改成和所有窗口同一份**（theme.css 的设计令牌）。
 *
 * 原来这里自带一整套：--card/#202228、--accent/#4E6EF2（亮色 #2563EB），
 * 而且只认 `prefers-color-scheme` —— 两处不一致用户都看得见：
 *   ① 提示条左边那条强调色的蓝，和设置页 / 结果窗的蓝不是同一个蓝；
 *   ② 用户在设置里强制亮色 / 暗色时提示条**不跟随**
 *      （别的窗口都变白了，右下角这张卡片还是黑的）。
 *
 * 现在颜色全部来自令牌，只保留一个 `--dim` 别名（标题行用它）。
 * 卡片原本那 96% 的轻微透明改用 `color-mix` 表达（WebView2 156 支持）。 */
:root {
    --dim: var(--fg-dim);
}

html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    /* 窗口本身就是这张卡片，留 6px 给投影，别让它贴边被裁 */
    padding: 6px;
    font: var(--fs-body)/var(--lh-body) var(--font-ui);
    color: var(--fg);
    user-select: none;
    cursor: default;
}

#card {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    height: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    /* 96% 不透明：卡片压在别人窗口上时还能透一点底色（原来是写死的 rgba） */
    background: color-mix(in srgb, var(--card) 96%, transparent);
    box-shadow: var(--shadow);
    /* 进场：从下方 10px 滑上来 + 淡入；退场反过来 */
    opacity: 0;
    transform: translateY(10px);
    transition: opacity .16s ease, transform .16s cubic-bezier(.22, 1, .36, 1);
}

#card.in {
    opacity: 1;
    transform: none;
}

#card.out {
    opacity: 0;
    transform: translateY(6px);
}

/* 左侧一条强调色，比整块彩色低调，又能一眼看出"这是 Quick Achieve 在说话" */
#bar {
    flex: none;
    width: 3px;
    height: 30px;
    border-radius: var(--radius-xs);
    background: var(--accent);
}

#txt {
    flex: 1 1 auto;
    min-width: 0;
}

#title {
    font-size: 10.5px;
    letter-spacing: .05em;
    color: var(--dim);
    line-height: 1.35;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

#msg {
    margin-top: 2px;
    font-size: 13px;
    line-height: 1.45;
    color: var(--fg);
    /* 最多两行：正文是"正在使用：划词搜索 · 某某软件"，软件名一长会换行 */
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    overflow-wrap: anywhere;
}
</style>
</head>
<body>
<div id="card">
    <div id="bar"></div>
    <div id="txt">
        <div id="title">Quick Achieve</div>
        <div id="msg"></div>
    </div>
</div>
<script>
/* v2.23.34：**主题要跟着软件设置走**。
 *
 * 这个窗口没引 shared.js（2000 行，为一张小卡片拉进来不划算），
 * 所以这里写一份和 shared.js 里 `qsApplyPageTheme` 同源的最小版本：
 * 读一次配置写 `data-theme`，之后配置广播（qs://config）来了再更新。
 * 少了它，用户在设置里强制亮色 / 暗色时，只有这张卡片不跟随。 */
(function () {
    const el = document.documentElement;
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    let cur = 'system';
    const paint = () => {
        el.dataset.theme = cur;
        const dark = cur === 'dark' || (cur !== 'light' && mq.matches);
        el.style.colorScheme = dark ? 'dark' : 'light';
    };
    paint();
    if (mq.addEventListener) mq.addEventListener('change', () => { if (cur === 'system') paint(); });
    const core = window.__TAURI__ && window.__TAURI__.core;
    if (core && core.invoke) {
        core.invoke('get_config').then((c) => { cur = (c && c.theme) || 'system'; paint(); }).catch(() => { });
    }
    const evt = window.__TAURI__ && window.__TAURI__.event;
    if (evt && evt.listen) {
        evt.listen('qs://config', (e) => {
            cur = (e && e.payload && e.payload.theme) || 'system';
            paint();
        }).catch(() => { });
    }
})();

(function () {
    const invoke = window.__TAURI__.core.invoke;
    const listen = window.__TAURI__.event.listen;
    const card = document.getElementById('card');
    const msg = document.getElementById('msg');
    let timer = 0;

    function hide() {
        if (card.classList.contains('out')) return;
        card.classList.remove('in');
        card.classList.add('out');
        // 等退场动画播完再让 Rust 把窗口藏起来（180ms 比 .16s 略长，稳一点）
        setTimeout(() => { invoke('toast_hide').catch(() => { }); }, 190);
    }

    function render(p) {
        const text = (p && p.text) ? String(p.text) : '';
        if (!text) return;
        // 下限 800ms：再短用户根本来不及看清
        const ms = Math.max(800, Number((p && p.ms) || 3000));
        msg.textContent = text;
        msg.title = text;
        card.classList.remove('out');
        // 先摘掉 in 再挂回去，保证连续两次提示都能重新播进场动画
        card.classList.remove('in');
        void card.offsetWidth;
        card.classList.add('in');
        if (timer) clearTimeout(timer);
        timer = setTimeout(hide, ms);
    }

    listen('qs://hint', (ev) => render(ev.payload));

    /* 首帧可能比 Rust 的第一次 emit 晚到（新窗口正在加载 WebView2），
       所以主动拉一次"最近一次提示内容"。 */
    invoke('toast_pull').then((p) => { if (p && p.text) render(p); }).catch(() => { });
})();
</script>
</body>
</html>
