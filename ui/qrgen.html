<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>二维码生成</title>
<link rel="stylesheet" href="theme.css">
<style>
/* 二维码生成结果窗（v2.12.2）：和 qr.html 同一套骨架 —— 顶部状态条 + 主体 + 底部动作。
 * 区别只有主体：那边是"截图 + 解出来的文字"，这边是"一枚二维码 + 它编码的内容"。
 * 大小刻意做小（440×560）：它是"点一下看一眼、复制走人"的弹出窗，不该占半屏。 */
* { box-sizing: border-box; }

html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font: var(--fs-body)/var(--lh-body) var(--font-ui);
    user-select: none;
    -webkit-user-select: none;
}

body { display: flex; flex-direction: column; overflow: hidden; }

/* ---------------------------------- 顶部 ---------------------------------- */
.top {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--card);
    border-bottom: 1px solid var(--line);
}
.badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 2px 8px;
    border-radius: var(--radius-pill);
    font-size: 12px;
    font-weight: 700;
    /* v2.23.34：原来是旧品牌青色 #0E7490，和全软件的蓝强调色不是一套（用户能看到）。 */
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 10%, transparent);
    white-space: nowrap;
}
.badge.ok { color: var(--ok); background: var(--ok-bg); }
.badge.err { color: var(--danger); background: rgba(229, 72, 77, .10); }
.note { color: var(--fg-dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------------------------------- 主体 ---------------------------------- */
.main {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 14px 14px 10px;
    min-height: 0;
}

/* 二维码固定白底：暗色主题下也不能跟着变 —— 扫描器靠黑白反差找码。 */
.qrbox {
    flex: none;
    align-self: center;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    background: #fff;
    border-radius: var(--radius-lg);
    box-shadow: 0 3px 14px rgba(0, 0, 0, .18);
}
.qrbox canvas { display: block; width: 220px; height: 220px; image-rendering: pixelated; }

.cap {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-size: 11.5px;
    color: var(--fg-dim);
}
.cap b { color: var(--fg); font-size: 12px; font-weight: 700; }

textarea {
    flex: 1 1 auto;
    min-height: 62px;
    resize: none;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: var(--radius-ctl);
    background: var(--card);
    color: var(--fg);
    font: inherit;
    font-size: 12.5px;
    line-height: 1.5;
    outline: none;
    /* 内容要能选中复制 —— 这是这个窗口存在的意义之一 */
    user-select: text;
    -webkit-user-select: text;
}
textarea:focus { border-color: var(--accent); }

/* 没有内容时的空态：说清楚"为什么没有"，而不是给一块空白画布 */
.empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 18px;
    border: 1px dashed var(--line);
    border-radius: var(--radius-lg);
    text-align: center;
    color: var(--fg-dim);
    font-size: 12.5px;
    line-height: 1.7;
}
.empty[hidden] { display: none; }
.empty b { color: var(--fg); font-size: 13px; }

/* ---------------------------------- 底部 ---------------------------------- */
.actions {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: var(--card);
    border-top: 1px solid var(--line);
}
.actions .spacer { flex: 1; }

button {
    height: 32px;
    padding: 0 14px;
    border: 1px solid var(--line);
    border-radius: var(--radius-ctl);
    background: transparent;
    color: var(--fg);
    font: inherit;
    cursor: pointer;
    transition: background-color .12s ease, border-color .12s ease, color .12s ease;
}
button:hover:not([disabled]) { background: var(--hover); }
button[disabled] { opacity: .45; cursor: default; }
button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
}
button.primary:hover:not([disabled]) { filter: brightness(1.06); }
button.ghost { color: var(--fg-dim); }
/* 复制成功那一下：按钮自己变成"已复制"，和顶部提示互为冗余 —— 用户眼睛在
 * 按钮上时不必再抬头看状态条。 */
button.done {
    background: var(--ok);
    border-color: var(--ok);
    color: #fff;
    font-weight: 600;
}
</style>
</head>
<body>

<div class="top">
    <span class="badge" id="badge">二维码生成</span>
    <span class="note" id="note"></span>
</div>

<div class="main">
    <div class="qrbox" id="qrbox"><canvas id="qrcv" width="220" height="220"></canvas></div>
    <div class="cap"><b>内容</b><span id="meta"></span></div>
    <textarea id="text" spellcheck="false" readonly placeholder="没有内容"></textarea>
    <div class="empty" id="empty" hidden>
        <b>没有读到选中的文字</b>
        <div>先在任意软件里选中文字或链接，再点这一格。<br>也可以直接复制内容后重试。</div>
    </div>
</div>

<div class="actions">
    <button type="button" class="primary" id="btnCopy">复制内容</button>
    <span class="spacer"></span>
    <button type="button" class="ghost" id="btnClose">关闭</button>
</div>

<script src="shared.js"></script>
<!-- v2.23.0：以前没挂 i18n，英文界面下这个窗还是中文 -->
<script src="i18n.js"></script>
<script src="i18n.en.js"></script>
<script src="vendor/qrcode.min.js"></script>
<script src="vendor/qrcode-utf8.js"></script>
<script>
/* IPC 兼容层：与 region.html / ocr.html / qr.html 完全一致。缺了宿主注入的
 * `__TAURI__` 就给永远 reject 的桩 —— 这里绝不能抛错，一抛错后面全不执行，
 * 用户看到的是一块空白窗口。 */
const _core = window.__TAURI__ && window.__TAURI__.core ? window.__TAURI__.core : null;
const _evt = window.__TAURI__ && window.__TAURI__.event ? window.__TAURI__.event : null;
const invoke = _core ? _core.invoke : () => Promise.reject(new Error('tauri global missing'));
const listen = _evt && typeof _evt.listen === 'function' ? _evt.listen : null;
window.addEventListener('error', (e) => {
    try { invoke('log_msg', { msg: '[qrgen] JS ERROR: ' + e.message + ' @' + e.lineno }); } catch (_) { }
});
</script>
<script>
/* ------------------------------------------------------------------ */
/* 二维码生成结果窗                                                     */
/*                                                                     */
/* 分工与设置页里那块生成面板一致：内容由 Rust 递过来（选中的文字 /      */
/* 剪贴板），编码和绘制全在本机做完（qrcode-generator，已内嵌）。        */
/* ------------------------------------------------------------------ */
const $ = (id) => document.getElementById(id);

let CUR = '';          // 当前编码进二维码的那段内容
let copyTimer = 0;     // 「已复制」提示的回退计时器

function say(msg) {
    const n = $('note');
    if (n) n.textContent = msg || '';
}

function setBadge(text, kind) {
    const b = $('badge');
    if (!b) return;
    b.textContent = text;
    b.classList.toggle('ok', kind === 'ok');
    b.classList.toggle('err', kind === 'err');
}

/** 把内容画成二维码。返回是否画成了。 */
function draw(text) {
    const cv = $('qrcv');
    if (!cv || typeof qrcode !== 'function') return false;
    const qr = qrcode(0, 'M');   // 0 = 按内容自动挑版本
    qr.addData(text);            // UTF-8（vendor/qrcode-utf8.js 把字节编码换过了）
    qr.make();
    const n = qr.getModuleCount();
    const margin = 4;            // 静区：少了手机扫不出来
    const dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
    const cell = Math.max(2, Math.floor((220 * dpr) / (n + margin * 2)));
    const side = cell * (n + margin * 2);
    cv.width = side;
    cv.height = side;
    cv.style.width = Math.round(side / dpr) + 'px';
    cv.style.height = cv.style.width;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, side, side);
    ctx.fillStyle = '#000';
    for (let r = 0; r < n; r += 1) {
        for (let c = 0; c < n; c += 1) {
            if (qr.isDark(r, c)) {
                ctx.fillRect((c + margin) * cell, (r + margin) * cell, cell, cell);
            }
        }
    }
    return true;
}

/** 渲染一份内容：能画就画，画不了（太长/组件缺失）就明说，不留白框。 */
function render(text) {
    const t = String(text || '').trim();
    CUR = t;
    const empty = $('empty');
    const box = $('qrbox');
    const ta = $('text');
    if (!t) {
        if (box) box.hidden = true;
        if (ta) ta.hidden = true;
        if (empty) empty.hidden = false;
        setBadge('没有内容', 'err');
        say('先在别处选中文字或链接，再点这一格');
        $('btnCopy').disabled = true;
        return;
    }
    try {
        if (!draw(t)) throw new Error('二维码组件没加载');
    } catch (e) {
        if (box) box.hidden = true;
        if (ta) ta.hidden = false;
        if (empty) empty.hidden = true;
        if (ta) ta.value = t;
        setBadge('生成失败', 'err');
        say(/overflow|too (big|long)|length/i.test(String(e && e.message || e))
            ? '内容太长，一张二维码放不下' : ('生成失败：' + (e && e.message || e)));
        $('btnCopy').disabled = false;
        return;
    }
    if (box) box.hidden = false;
    if (empty) empty.hidden = true;
    if (ta) { ta.hidden = false; ta.value = t; }
    setBadge('已生成', 'ok');
    say(t.length + ' 字 · 用手机扫一下就能读回内容');
    $('meta').textContent = t.length + ' 字';
    $('btnCopy').disabled = false;
}

/** 复制：把**编码进二维码的那段内容**写进剪贴板，并给出双重反馈
 *  （顶部状态条 + 按钮自身变成「已复制 ✓」）。 */
async function copyIt() {
    if (!CUR) return;
    const btn = $('btnCopy');
    try {
        await invoke('copy_text', { text: CUR });
        btn.classList.add('done');
        btn.textContent = '已复制 ✓';
        setBadge('已复制', 'ok');
        say('内容已复制到剪贴板（' + CUR.length + ' 字）');
        if (copyTimer) clearTimeout(copyTimer);
        copyTimer = setTimeout(() => {
            btn.classList.remove('done');
            btn.textContent = '复制内容';
            setBadge('已生成', 'ok');
            say(CUR.length + ' 字 · 用手机扫一下就能读回内容');
        }, 1600);
    } catch (e) {
        setBadge('复制失败', 'err');
        say('复制失败：' + String(e || ''));
    }
}

$('btnCopy').addEventListener('click', copyIt);
$('btnClose').addEventListener('click', () => { invoke('close_qrgen_window').catch(() => { }); });

/* Esc 关闭：这类小窗用户的第一反应就是按 Esc。 */
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { e.preventDefault(); invoke('close_qrgen_window').catch(() => { }); }
    if ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === 'c'
        && document.activeElement !== $('text')) {
        e.preventDefault();
        copyIt();
    }
});

/** 首帧：先把窗口亮出来（后端在等这个信号），再按内容渲染。
 *  「再点一次生成」时窗口已存在，后端会发 `qs://qrgen` 推新内容过来。 */
function boot() {
    const el = $('text');
    if (el) el.value = '';
    invoke('qrgen_take_text').then((t) => {
        render(t || '');
    }).catch(() => render(''));
    requestAnimationFrame(() => requestAnimationFrame(() => {
        invoke('qrgen_ready').catch(() => { });
    }));
}

if (typeof listen === 'function') {
    listen('qs://qrgen', () => {
        // 窗口复用（第二次点生成）：重新拉一次内容，别把上一轮的码留在屏幕上
        invoke('qrgen_take_text').then((t) => render(t || '')).catch(() => { });
    });
}
boot();
</script>
</body>
</html>
