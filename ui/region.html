<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>框选识别区域</title>
<style>
/* 这个页面的样式故意内联：整个窗口就一个遮罩 + 一个方框 + 一条动作条，
   不值得再拆一个 css 文件，而且少一个文件就少一种「打包漏了导致一片空白」的可能。 */
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    cursor: crosshair;
    user-select: none;
    -webkit-user-select: none;
    font: 13px/1.5 "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
}

/* 整屏压暗。选中区域靠 .sel 自己的超大 box-shadow「掏」出一个洞 ——
   比摆四个遮罩 div 简单，也不会在边界露缝。 */
#dim {
    position: fixed;
    inset: 0;
    background: rgba(10, 12, 18, .34);
    cursor: crosshair;
}

#sel {
    position: fixed;
    display: none;
    border: 1.5px solid #4C8DFF;
    border-radius: 2px;
    background: rgba(255, 255, 255, .04);
    box-shadow: 0 0 0 9999px rgba(10, 12, 18, .34);
    pointer-events: none;
}

/* 调整手柄层。**故意不接鼠标事件**（pointer-events:none）：命中判定全在 JS 里
   按坐标算（见 hitTest）。DOM 命中会被 1.5px 的边框、半像素对齐、以及选框
   与手柄的层叠顺序反复坑，坐标判定只有一套真值，改起来也不会自相矛盾。 */
#frame {
    position: fixed;
    display: none;
    pointer-events: none;
}
#frame .h {
    position: absolute;
    width: 7px;
    height: 7px;
    margin: -3.5px 0 0 -3.5px;
    background: #4C8DFF;
    border: 1px solid #fff;
    border-radius: 1px;
}

#size {
    position: fixed;
    display: none;
    padding: 3px 8px;
    border-radius: 6px;
    background: rgba(16, 18, 24, .9);
    color: #fff;
    font-size: 11.5px;
    font-variant-numeric: tabular-nums;
    pointer-events: none;
    white-space: nowrap;
}

#tip {
    position: fixed;
    left: 50%;
    top: 40px;
    transform: translateX(-50%);
    padding: 9px 18px;
    border-radius: 10px;
    background: rgba(16, 18, 24, .88);
    color: #F0F2F6;
    font-size: 13px;
    box-shadow: 0 10px 30px -10px rgba(0, 0, 0, .7);
    pointer-events: none;
    white-space: nowrap;
}
#tip b { color: #7FB0FF; font-weight: 600; }

/* ---------------- 动作条（v2.16.0） ----------------
   松手之后浮出来，一行按钮决定「这块区域拿去干什么」。
   位置贴着选区右下角外侧，放不下就自动翻到别的边（见 placeBar）。 */
#actbar {
    position: fixed;
    display: none;
    align-items: center;
    gap: 2px;
    padding: 4px;
    border-radius: 9px;
    background: rgba(16, 18, 24, .94);
    box-shadow: 0 10px 26px -8px rgba(0, 0, 0, .75), 0 0 0 1px rgba(255, 255, 255, .08) inset;
    white-space: nowrap;
    z-index: 10;
}
#actbar button {
    appearance: none;
    border: 0;
    background: transparent;
    color: #E8EDF6;
    font: inherit;
    font-size: 12.5px;
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
}
#actbar button:hover { background: rgba(255, 255, 255, .12); }
/* 默认动作（= 这次框选本来的用途）高亮：不想换用途的人直接双击就行，
   想换的人一眼能看到「现在按下去会发生什么」。 */
#actbar button.on { background: #4C8DFF; color: #fff; }
#actbar button.on:hover { background: #5C99FF; }
#actbar button .k {
    font-size: 10.5px;
    opacity: .72;
    font-variant-numeric: tabular-nums;
}
#actbar .sep { width: 1px; align-self: stretch; margin: 2px 3px; background: rgba(255, 255, 255, .16); }
#actbar .hint {
    color: #9FB0C8;
    font-size: 11.5px;
    padding: 0 8px 0 2px;
}
#actbar .hint b { color: #C9D7EA; font-weight: 600; }
</style>
</head>
<body>
<div id="dim"></div>
<div id="sel"></div>
<div id="frame">
    <div class="h" data-h="nw"></div><div class="h" data-h="n"></div><div class="h" data-h="ne"></div>
    <div class="h" data-h="w"></div><div class="h" data-h="e"></div>
    <div class="h" data-h="sw"></div><div class="h" data-h="s"></div><div class="h" data-h="se"></div>
</div>
<div id="size"></div>
<div id="actbar"></div>
<div id="tip">拖拽框选要识别的区域 · <b>Esc</b> 取消</div>

<script src="i18n.js"></script>
<script src="i18n.en.js"></script>
<script>
/* 日志通道要最先定义：这个页面一旦异常，表现就是「满屏遮罩、点哪都没反应」，
   没有日志就等于瞎查。任何 JS 错误都回传给 Rust 落进 log.txt。 */
function jlog(msg) {
    try {
        window.__TAURI__.core.invoke('log_msg', { msg: '[region] ' + msg });
    } catch (_) { }
}
window.addEventListener('error', (e) =>
    jlog('JS ERROR: ' + e.message + ' @' + e.lineno + ':' + e.colno));
window.addEventListener('unhandledrejection', (e) =>
    jlog('JS UNHANDLED: ' + ((e.reason && e.reason.message) || e.reason)));

const hasTauri = !!(window.__TAURI__ && window.__TAURI__.core);
jlog('page script start, tauri=' + hasTauri + ' dpr=' + (window.devicePixelRatio || 1));

/* 这一轮框选是要**识图** / **二维码** / **OCR**。
 *
 * 靠 URL 参数区分（`region.html?mode=img`），而不是让 Rust 塞全局变量 ——
 * 同一个遮罩窗口复用多套用途，页面按参数决定"默认动作"是哪一个。
 * 框选交互（拖框、调整、Esc、右键、看门狗）对三者完全一样。
 *
 * v2.16.0：以前这个参数决定"唯一用途"（且不可改）；现在只决定**默认动作** ——
 * 动作条上还能临时换成另外几种，不用退出去改设置再重框。 */
const MODE = (function () {
    try {
        const m = /[?&]mode=([a-z]+)/.exec(window.location.search || '');
        const v = m && m[1];
        /* v2.12.0：三种用途（ocr / img / qr）。以前这里只认 img，其余一律当 ocr，
         * 于是 `?mode=qr` 会被悄悄降级成 OCR —— 框完弹出的是文字识别窗。
         * v2.23.3：多了 `any` = **万能框选** —— 不预设用途，框完弹动作条让用户挑。
         * 它只由 `@any` 哨兵（`region_any_start`）开，不参与上面那三种的降级。 */
        return (v === 'img' || v === 'qr' || v === 'any') ? v : 'ocr';
    } catch (_) { return 'ocr'; }   // 解析不出来就当 OCR（老行为）
})();
jlog('mode=' + MODE);

/* 就算 Tauri 全局没注入也绝不能在这里抛错 —— 一抛错后面的事件监听就全没了，
   那才是「满屏点不动」的真正来源。缺了就给个永远 reject 的桩，
   各处的 .catch / 看门狗会收拾残局。 */
const invoke = hasTauri
    ? window.__TAURI__.core.invoke
    : () => Promise.reject(new Error('tauri global missing'));

/* 心跳：每 2 秒向 Rust 报一次「我还活着」。页面脚本跑起来了就一定发得出；
   Rust 那边开窗 5 秒还收不到心跳，会判定页面没活过来并主动关窗兜底。 */
let beatTimer = null;
function startBeat() {
    const beat = () => invoke('region_beat').catch(() => { });
    beat();
    beatTimer = setInterval(beat, 2000);
}
function stopBeat() {
    if (beatTimer) { clearInterval(beatTimer); beatTimer = null; }
}
startBeat();

const $ = (id) => document.getElementById(id);

const dim = $('dim');
const sel = $('sel');
const frame = $('frame');
const sizeEl = $('size');
const tip = $('tip');
const actbar = $('actbar');

/* 各用途的人话名字：动作条按钮、日志、出错提示共用一份，改文案只改这里。 */
/* v2.18.0 多了「翻译」：识别完直接把文字送进翻译窗（省掉"复制→开翻译→粘贴"）。 */
const ACT_NAME = { ocr: '识别', trans: '翻译', img: '识图', qr: '二维码', copy: '复制图片' };

/* 顶部提示按用途换一句话：识图是"框完去搜图"，OCR 是"框完去认字"，
   app 是"点一下某个程序"（r59 的十字准星点选）。
   不换的话用户框完会以为点了 OCR，白白再框一次。 */
tip.innerHTML = MODE === 'img'
    ? '拖拽框选要识图搜索的区域 · <b>Esc</b> 取消'
    : MODE === 'app'
        ? '点一下要绑定的那个程序窗口（鼠标移到目标上点左键） · <b>Esc</b> 取消'
        : MODE === 'any'
            ? '拖拽框选一块区域，松开后选择要做什么（识别 / 翻译 / 识图 / 二维码） · <b>Esc</b> 取消'
            : '拖拽框选要识别的区域 · <b>Esc</b> 取消';

/* 取消阶段的提示统一走这里，免得几处各写一句、下次改文案漏掉一处 */
const TIP_IDLE = tip.innerHTML;

/* ------------------------------------------------------------------ */
/* 状态                                                                */
/* ------------------------------------------------------------------ */
/* 阶段：
 *   idle    —— 等用户按下鼠标开新框
 *   drag    —— 正在拖出新框（首次按下 → 抬起）
 *   adjust  —— 框好了、**还没执行**：可以拖角改大小、拖内部平移、选动作（v2.16.0）
 *   committed —— 已经交给 Rust 了，页面等窗口被关掉
 */
let phase = 'idle';
/* 选区几何，CSS 像素（= 屏幕上看到的位置，Rust 侧再乘 dpr）
 *
 * ⚠ 只有这一份真值：绘制、命中判定、发给后端的坐标全部由它派生。
 *   以前这里有 sx/sy/cx/cy 四个变量 + rectOf() 临时算，加"调整"之后
 *   再这么干就会两套坐标打架（拖角时改哪几个？），所以收成一个 rect。 */
let rect = { x: 0, y: 0, w: 0, h: 0 };

/* 本次交互的起点（drag / move / resize 三种模式共用） */
let gesture = {
    mode: '',          // '' | new | move | nw | n | ne | w | e | sw | s | se
    ox: 0, oy: 0,      // 按下时的指针
    start: null,       // 按下时的 rect 快照
};

/* 框选后是否**停下来给调整/换用途**（配置项 `regionAdjust`，默认关）。
 *
 * ⚠ v2.23.3：默认值从"开"改成"关"。用户两次反馈，第二次是"完全没修好"：
 *   「我通过文本识别功能，就只要文本识别功能就可以了，不要识图，不要翻译，
 *     也不要二维码。需要相关的功能，我会特别打开的。」
 *
 * 所以默认路径是：**松开鼠标 → 立刻按 ?mode= 执行**（识别就是识别），
 * 不出现手柄、不出现动作条、也不问你第二遍。
 * 只有显式打开「框选后可调整」的人才走"停下来选"的老流程
 * （那条路也是「复制图片」唯一的入口）。 */
let holdMode = (MODE === 'any');

/* 上次在动作条上点过的动作（后端记的）。双击/回车执行的就是它 ——
   固定用来"翻译截图"的人，第二次起就不必再点按钮了。
   空串 = 还没点过 → 回落到这次框选的用途（?mode=）。

   ⚠ 只在"**停留**"模式下生效：关掉停留（松手即执行）时仍然按 ?mode= 走，
   否则"开 OCR 窗口却翻译了"会莫名其妙。 */
let lastAct = '';

/** 双击/回车要执行的动作：上次用过的 → 否则这次框选的用途。
 *
 *  ⚠ `mode=any`（万能框选）本身不是动作，只是"让我挑" —— 没点过就按识别，
 *  不然 `commit('any')` 会绕一圈落到后端的兜底分支，语义上说不通。 */
function defaultAct() {
    if (lastAct && ACT_NAME[lastAct]) return lastAct;
    return (MODE === 'any') ? 'ocr' : MODE;
}

/* 真正执行：把这块区域交给后端，按 action 分流。 */
let committed = false;
function commit(action) {
    if (committed) return;
    committed = true;
    phase = 'committed';
    stopBeat();
    actbar.style.display = 'none';
    frame.style.display = 'none';
    sel.style.display = 'none';
    sizeEl.style.display = 'none';

    const r = {
        x: Math.round(rect.x),
        y: Math.round(rect.y),
        w: Math.round(rect.w),
        h: Math.round(rect.h),
    };
    /* 数字必须都是有限值才敢发 —— 带着 NaN/Infinity 过去，Rust 那边
     * 反序列化会失败，命令等于没执行，遮罩就会一直留着。 */
    if (![r.x, r.y, r.w, r.h].every((n) => Number.isFinite(n)) || r.w < 1 || r.h < 1) {
        bail('框选坐标算不出来，已退出');
        return;
    }
    jlog('commit action=' + action + ' ' + JSON.stringify(r));
    tip.textContent = '正在' + (ACT_NAME[action] || '处理') + '…';
    tip.style.display = '';
    invoke('region_action', {
        action: action,
        x: r.x,
        y: r.y,
        w: r.w,
        h: r.h,
        dpr: window.devicePixelRatio || 1
    }).catch((e) => {
        jlog('region_action failed: ' + ((e && e.message) || e));
        bail('没能开始' + (ACT_NAME[action] || '处理') + '，已退出框选');
    });

    // 看门狗：正常情况下 Rust 收到命令会立刻关掉这个窗口，页面随之销毁，
    // 这个定时器也就不会跑。要是 6 秒后页面还活着，说明那条命令根本没到，
    // 那就自己退场，绝不把用户困在满屏点不动的状态里。
    setTimeout(() => {
        if (committed) invoke('ocr_cancel').catch(() => { });
    }, 6000);
}

/* 兜底退出：无论哪里出错，都必须把这个铺满全屏的遮罩窗口关掉。
   它一旦留下，用户满屏都点不动，是最糟糕的失败形态。

   ⚠ 守卫用 `bailing` 而不是 `done`：`app` 模式点一下之后会先把 done 立起来
   （防重复识别），随后 pick_app_at 失败还要走这里报错 —— 拿 done 当守卫的话
   那条报错就永远弹不出来，用户只看到遮罩一闪而过。 */
let done = false;
let bailing = false;
function bail(msg) {
    if (bailing) return;
    bailing = true;
    done = true;
    committed = true;
    phase = 'committed';
    gesture.mode = '';
    stopBeat();
    sel.style.display = 'none';
    frame.style.display = 'none';
    sizeEl.style.display = 'none';
    actbar.style.display = 'none';
    if (msg) {
        tip.textContent = msg;
        tip.style.display = '';
    }
    jlog('bail' + (msg ? ': ' + msg : ''));
    invoke('ocr_cancel').catch(() => { });
}

/* ------------------------------------------------------------------ */
/* 绘制                                                                */
/* ------------------------------------------------------------------ */
/* 顶到屏幕边缘就跟屏幕对齐：拖到离边 8px 以内自动贴上去。
   截图工具的老习惯 —— 用户想框"一整块面板"时，手抖那几像素就该被吃掉。 */
const SNAP = 8;
function snap(v, max) {
    if (v <= SNAP) return 0;
    if (v >= max - SNAP) return max;
    return v;
}

function paint() {
    const r = rect;
    sel.style.display = 'block';
    sel.style.left = r.x + 'px';
    sel.style.top = r.y + 'px';
    sel.style.width = r.w + 'px';
    sel.style.height = r.h + 'px';

    /* 手柄：8 个，位置由 rect 算（不靠 CSS 百分比，边框宽度一变也不会偏） */
    if (phase === 'adjust') {
        frame.style.display = 'block';
        frame.style.left = r.x + 'px';
        frame.style.top = r.y + 'px';
        frame.style.width = r.w + 'px';
        frame.style.height = r.h + 'px';
        for (const el of frame.children) {
            const h = el.dataset.h;
            const cx = (h === 'nw' || h === 'w' || h === 'sw') ? 0
                : (h === 'ne' || h === 'e' || h === 'se') ? r.w : r.w / 2;
            const cy = (h === 'nw' || h === 'n' || h === 'ne') ? 0
                : (h === 'sw' || h === 's' || h === 'se') ? r.h : r.h / 2;
            el.style.left = cx + 'px';
            el.style.top = cy + 'px';
            el.style.display = (r.w < 24 || r.h < 24) ? 'none' : 'block';
        }
    } else {
        frame.style.display = 'none';
    }

    if (r.w > 20 && r.h > 20) {
        sizeEl.style.display = 'block';
        sizeEl.textContent = Math.round(r.w) + ' × ' + Math.round(r.h);
        // 贴着选框上方，顶到屏幕边就挪到里面
        const above = r.y - 26;
        sizeEl.style.left = r.x + 'px';
        sizeEl.style.top = (above > 4 ? above : r.y + 6) + 'px';
    } else {
        sizeEl.style.display = 'none';
    }

    if (phase === 'adjust') placeBar();
}

/* 动作条摆位：优先选区**右下角外侧**（不压住刚框住的内容），
   四个方向都试一遍，哪儿放得下就放哪儿；实在都放不下就贴在视口内。 */
function placeBar() {
    actbar.style.display = 'flex';
    const bw = actbar.offsetWidth || 240;
    const bh = actbar.offsetHeight || 34;
    const vw = window.innerWidth, vh = window.innerHeight;
    const gap = 8;
    const cands = [
        [rect.x + rect.w - bw, rect.y + rect.h + gap],   // 正下方（右对齐）
        [rect.x + rect.w + gap, rect.y + rect.h - bh],   // 右下
        [rect.x + rect.w + gap, rect.y],                 // 右上
        [rect.x, rect.y - bh - gap],                     // 正上方
    ];
    let bx = cands[0][0], by = cands[0][1], ok = false;
    for (const [x, y] of cands) {
        if (x >= gap && y >= gap && x + bw <= vw - gap && y + bh <= vh - gap) {
            bx = x; by = y; ok = true; break;
        }
    }
    if (!ok) {
        // 选区几乎占满整屏（框一整页）：贴着视口右下角，别跑出屏幕
        bx = Math.min(Math.max(gap, rect.x + rect.w - bw), vw - bw - gap);
        by = Math.min(rect.y + rect.h + gap, vh - bh - gap);
        if (by < gap) by = Math.min(vh - bh - gap, Math.max(gap, rect.y + 6));
    }
    actbar.style.left = Math.round(bx) + 'px';
    actbar.style.top = Math.round(by) + 'px';
}

/* 光标随"指到哪儿"变：手柄上是 resize 光标，框内是 move，
   其它地方是 crosshair（= 重新框）。这是调整阶段唯一的"可操作性提示"。 */
const CURSOR = {
    nw: 'nwse-resize', se: 'nwse-resize',
    ne: 'nesw-resize', sw: 'nesw-resize',
    n: 'ns-resize', s: 'ns-resize',
    w: 'ew-resize', e: 'ew-resize',
    move: 'move',
    new: 'crosshair',
};
function hitTest(x, y) {
    if (phase !== 'adjust') return 'new';
    const { x: rx, y: ry, w: rw, h: rh } = rect;
    const T = 7;   // 手柄吸附半径（px）
    const nearL = Math.abs(x - rx) <= T;
    const nearR = Math.abs(x - (rx + rw)) <= T;
    const nearT = Math.abs(y - ry) <= T;
    const nearB = Math.abs(y - (ry + rh)) <= T;
    // 只有落在"选区外扩 T"的范围内，才可能是手柄
    if (x >= rx - T && x <= rx + rw + T && y >= ry - T && y <= ry + rh + T) {
        if (nearL && nearT) return 'nw';
        if (nearR && nearT) return 'ne';
        if (nearL && nearB) return 'sw';
        if (nearR && nearB) return 'se';
        if (nearL) return 'w';
        if (nearR) return 'e';
        if (nearT) return 'n';
        if (nearB) return 's';
        if (rw >= 24 && rh >= 24) return 'move';
    }
    return 'new';
}

/* ------------------------------------------------------------------ */
/* 调整阶段的动作条                                                    */
/* ------------------------------------------------------------------ */
function buildBar() {
    actbar.textContent = '';
    const list = ['ocr', 'trans', 'img', 'qr', 'copy'];
    for (const a of list) {
        const b = document.createElement('button');
        b.dataset.act = a;
        b.textContent = ACT_NAME[a];
        // 高亮"双击会执行的那一个"（上次用过的 → 否则这次框选本来的用途）
        if (a === defaultAct()) b.classList.add('on');
        b.addEventListener('click', (e) => {
            e.stopPropagation();
            commit(a);
        });
        actbar.appendChild(b);
    }
    const sep = document.createElement('span');
    sep.className = 'sep';
    actbar.appendChild(sep);
    const hint = document.createElement('span');
    hint.className = 'hint';
    /* 写清"双击会执行哪一个"：不然记忆生效之后，用户会以为双击还是识别 */
    hint.innerHTML = '拖角调整 · 双击<b>' + (ACT_NAME[defaultAct()] || '执行') + '</b> · <b>Esc</b> 取消';
    actbar.appendChild(hint);
}

/* ------------------------------------------------------------------ */
/* 鼠标                                                                */
/* ------------------------------------------------------------------ */
/* 这里全部用 pointer 事件：鼠标与触屏/笔一套代码，Windows 上
   WebView2 的 pointer 事件也走同一套命中。 */

document.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 || done || phase === 'committed') return;
    // 点在动作条上：交给按钮自己处理，别在这里开新框
    if (actbar.contains(e.target)) return;

    const x = e.clientX, y = e.clientY;
    const kind = hitTest(x, y);

    if (kind === 'move' || (kind !== 'new' && phase === 'adjust')) {
        /* 调整既有选区：记下按下时的快照，后面按"指针位移"算新几何
         * （不在 rect 上累加 —— 累加会随着取整误差一路漂移）。 */
        gesture = { mode: kind, ox: x, oy: y, start: { ...rect } };
        phase = 'adjust';
        jlog('grab ' + kind + ' at ' + Math.round(x) + ',' + Math.round(y));
        return;
    }

    /* 新框：从零开始（adjust 阶段点空白处 = 重来，符合截图工具习惯） */
    gesture = { mode: 'new', ox: x, oy: y, start: null };
    phase = 'drag';
    rect = { x, y, w: 0, h: 0 };
    tip.style.display = 'none';
    actbar.style.display = 'none';
    jlog('pointerdown at ' + Math.round(x) + ',' + Math.round(y));
    paint();
});

document.addEventListener('pointermove', (e) => {
    if (done) return;
    const x = e.clientX, y = e.clientY;

    if (phase === 'idle' || phase === 'adjust') {
        // 只改光标，不画任何东西（idle 时鼠标划过不该有任何反馈）
        const kind = phase === 'adjust' ? hitTest(x, y) : 'new';
        document.body.style.cursor = CURSOR[kind] || 'crosshair';
        if (phase === 'adjust') {
            // 指着动作条时别把光标改成 move
            if (actbar.contains(e.target)) document.body.style.cursor = 'default';
        }
        if (!gesture.mode) return;
    }
    if (phase === 'drag') {
        const sx0 = gesture.ox, sy0 = gesture.oy;
        const x1 = snap(x, window.innerWidth), y1 = snap(y, window.innerHeight);
        rect = {
            x: Math.min(sx0, x1), y: Math.min(sy0, y1),
            w: Math.abs(x1 - sx0), h: Math.abs(y1 - sy0),
        };
        paint();
        return;
    }
    if (phase === 'adjust' && gesture.mode) {
        const dx = x - gesture.ox, dy = y - gesture.oy;
        const s = gesture.start;
        const m = gesture.mode;
        let nx = s.x, ny = s.y, nw = s.w, nh = s.h;
        const minW = 8, minH = 8;
        if (m === 'move') {
            /* 整块拖出屏幕很常见（用户想挪个位置），这里只做软限制：
             * 至少留 40px 在视口里，免得拖丢了找不回来。 */
            nx = Math.min(Math.max(-s.w + 40, s.x + dx), window.innerWidth - 40);
            ny = Math.min(Math.max(-s.h + 40, s.y + dy), window.innerHeight - 40);
            rect = { x: nx, y: ny, w: s.w, h: s.h };
        } else {
            // 八个方向：改动哪条边由 m 里的字母决定
            if (m.includes('w')) {
                const left = Math.min(s.x + dx, s.x + s.w - minW);
                nw = s.x + s.w - left; nx = left;
            }
            if (m.includes('e')) {
                nw = Math.max(minW, s.w + dx);
            }
            if (m.includes('n')) {
                const top = Math.min(s.y + dy, s.y + s.h - minH);
                nh = s.y + s.h - top; ny = top;
            }
            if (m.includes('s')) {
                nh = Math.max(minH, s.h + dy);
            }
            /* 边吸附：只吸附**被拖动的那条边**（拖右边时左边不该跟着动） */
            if (m.includes('w') && Math.abs(nx) <= SNAP) { const right = nx + nw; nx = 0; nw = right; }
            if (m.includes('n') && Math.abs(ny) <= SNAP) { const bottom = ny + nh; ny = 0; nh = bottom; }
            if (m.includes('e') && Math.abs(nx + nw - window.innerWidth) <= SNAP) nw = window.innerWidth - nx;
            if (m.includes('s') && Math.abs(ny + nh - window.innerHeight) <= SNAP) nh = window.innerHeight - ny;
            rect = { x: nx, y: ny, w: nw, h: nh };
        }
        paint();
    }
});

document.addEventListener('pointerup', (e) => {
    if (done || e.button !== 0 || phase === 'committed') return;

    if (phase === 'drag') {
        gesture.mode = '';
        // 太小的框基本是误点，直接当没框过
        if (rect.w < 8 || rect.h < 8) {
            rect = { x: 0, y: 0, w: 0, h: 0 };
            phase = 'idle';
            sel.style.display = 'none';
            frame.style.display = 'none';
            sizeEl.style.display = 'none';
            tip.innerHTML = TIP_IDLE;
            tip.style.display = '';
            return;
        }
        if (holdMode) {
            // 显式打开了「框选后可调整」才走这条：停下来微调 / 换用途
            phase = 'adjust';
            buildBar();
            tip.textContent = '还能调整：拖角改大小 · 双击执行 · Esc 取消';
            paint();
            document.body.style.cursor = 'move';
            jlog('adjust: ' + JSON.stringify(rect));
        } else {
            // 关掉「框选后停留」→ 老行为：松手就走
            phase = 'adjust';
            commit(MODE);
        }
        return;
    }

    if (phase === 'adjust') {
        // 松手 = 结束这次移动/改大小，继续留在 adjust
        if (gesture.mode) jlog('adjust end ' + JSON.stringify(rect));
        gesture.mode = '';
        paint();
    }
});

/* 双击执行默认动作：手已经停在选区上，这一下几乎是零成本 ——
   比"移动鼠标去找动作条按钮"快，也比按回车自然（纯鼠标）。 */
document.addEventListener('dblclick', (e) => {
    if (done || phase !== 'adjust') return;
    if (actbar.contains(e.target)) return;
    if (hitTest(e.clientX, e.clientY) === 'new') return;  // 双击空白 = 重新框，不执行
    commit(defaultAct());
});

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        jlog('ESC pressed -> cancel');
        bail();
        return;
    }
    if (e.key === 'Enter' && phase === 'adjust') {
        commit(defaultAct());
    }
});

// 右键也当取消，符合截图工具的肌肉记忆
document.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    if (done) return;
    bail();
});

/* ------------------------------------------------------------------ */
/* 启动：读配置 → 决定"松手是否停留"                                    */
/* ------------------------------------------------------------------ */
if (MODE === 'app') {
    /* r59：`app` 模式是"点一下窗口"，跟动作条无关 —— 保持老逻辑：
       单击直接 pick_app_at，不做停留。 */
    document.addEventListener('pointerup', (e) => {
        if (done || e.button !== 0) return;
        if (phase !== 'drag' && phase !== 'idle') return;
        done = true;
        phase = 'committed';
        stopBeat();
        sel.style.display = 'none';
        frame.style.display = 'none';
        sizeEl.style.display = 'none';
        tip.innerHTML = '正在识别这个窗口…';
        jlog('app click at ' + e.clientX + ',' + e.clientY);
        invoke('pick_app_at', {
            x: e.clientX,
            y: e.clientY,
            dpr: window.devicePixelRatio || 1
        }).catch((err) => {
            jlog('pick_app_at failed: ' + ((err && err.message) || err));
            bail('点选失败，已退出');
        });
    }, true);   // capture：要比上面那套拖框逻辑先拿到事件
} else {
    invoke('get_config').then((c) => {
        /* 默认**关**：读不到配置也按"框完直接执行"走（那才是主路径）。
         * 只有用户显式打开「框选后可调整」才停。
         * ⚠ `mode=any`（万能框选）**永远停**：它存在的意义就是让用户挑，
         *   那个开关只管"具体功能要不要也停"。 */
        holdMode = (MODE === 'any') || !!(c && c.regionAdjust);
        lastAct = (c && typeof c.regionLastAction === 'string') ? c.regionLastAction : '';
        jlog('regionAdjust=' + holdMode + ' lastAct=' + (lastAct || '(none)'));
        /* 配置比"拖框"慢到时（偶尔会比首帧晚几十毫秒），动作条已经画好了 ——
         * 这里重建一次，让高亮和"双击XXX"的文案立刻对上。 */
        if (phase === 'adjust') { buildBar(); paint(); }
    }).catch((e) => {
        // 读不到就按默认（框完直接执行）走 —— 那才是主路径，不能因为读配置失败就变成"停下来问"
        jlog('get_config failed: ' + ((e && e.message) || e) + ' -> 按「框完直接执行」处理');
    });
}

/* 失焦兜底 —— **故意不做**，这里只留一段说明，免得后人再把它加回来。
 *
 * 为什么删掉：
 *   遮罩是「铺满全屏 + 置顶」的，它一旦不响应，用户会满屏点不动，所以最初
 *   加了一层"一失焦就自己关掉"的兜底。但实测（见 log.txt）这层兜底**误关
 *   的概率远高于它救场的概率**：
 *     · WebView2 开窗时焦点交接是**多阶段**的，几百毫秒里会反复丢/拿焦点；
 *     · 就算熬过了交接期，本机上还有别的全局输入工具会在几秒后抢走前台 ——
 *       日志里抓到过 `blur (age=4313ms)`，用户压根没动过手，遮罩却自己关了。
 *   而"失焦"这件事**根本不代表用户被困住** —— 因为：
 *     ① 遮罩窗口还盖在屏幕上（`always_on_top`），视觉上没变；
 *     ② Esc 的退出走的是 Rust 那侧**全局低级键盘钩子**，全系统都收得到，
 *        跟哪个窗口在前台**无关**，照样能退出；
 *     ③ Rust 另有「页面 5 秒无心跳就关窗」+「90 秒总闸」两道硬兜底。
 *   所以：宁可让遮罩在失焦时多留一会儿（用户还能按 Esc），也不能让它
 *   在用户正要框选时自己消失。真出问题的兜底全在 Rust 侧。 */

</script>
</body>
</html>
